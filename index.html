<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>Basic Calculator</h1>
    <p class="sub">Everyday arithmetic, no fuss.</p>
  </header>

  <section class="calc" aria-label="Calculator">
    <div id="display" class="display" aria-live="polite">
      <div id="history" class="history"></div>
      <div id="current" class="current">0</div>
    </div>
    <div class="keys">
      <button type="button" class="key wide danger" data-action="clear">AC</button>
      <button type="button" class="key" data-action="backspace">⌫</button>
      <button type="button" class="key op" data-op="/">÷</button>

      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key op" data-op="*">×</button>

      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key op" data-op="-">−</button>

      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key op" data-op="+">+</button>

      <button type="button" class="key wide" data-digit="0">0</button>
      <button type="button" class="key" data-action="decimal">.</button>
      <button type="button" class="key equals" data-action="equals">=</button>
    </div>
  </section>

  <p class="hint">Keyboard works too: digits, + − * /, Enter for =, Backspace, Esc to clear.</p>
</main>
<script src="script.js"></script>
</body>
</html>
